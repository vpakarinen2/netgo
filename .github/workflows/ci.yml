name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Build
        run: go build -mod=readonly ./...
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd configs internal pkg)"
      - name: Dependency consistency
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Race detector
        run: go test -mod=readonly -race ./...
      - name: Port parser fuzzing
        run: go test ./pkg/network/targets -run='^$' -fuzz=FuzzParsePorts -fuzztime=10s
      - name: Address interval fuzzing
        run: go test ./pkg/network/targets -run='^$' -fuzz=FuzzSpanUnion -fuzztime=10s
      - name: Service fingerprint fuzzing
        run: go test ./pkg/service -run='^$' -fuzz=FuzzFingerprint -fuzztime=10s
      - name: UDP reply fuzzing
        run: go test ./pkg/network/sockets -run='^$' -fuzz=FuzzUDPReplyMatching -fuzztime=10s
